<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מפלסי מים בקידוחים — נתונים אינטראקטיביים</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #0f172a;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .status {
      font-size: 0.9rem;
      color: #475569;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
    }
    select, .range-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.9rem;
      cursor: pointer;
    }
    select:hover, .range-btn:hover {
      border-color: #94a3b8;
    }
    .range-btn.active {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label {
      font-size: 0.8rem;
      color: #64748b;
    }
    .stat-value {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 2px;
    }
    #chart {
      width: 100%;
      height: 560px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1 id="pageTitle">סדרת זמן — Meizar 1</h1>
        <div id="status" class="status">טוען נתונים...</div>
      </div>

      <div class="toolbar">
        <div class
