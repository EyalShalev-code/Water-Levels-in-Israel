<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תצוגת קידוח</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #0f172a;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back-link {
      text-decoration: none;
      background: #e2e8f0;
      color: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .back-link:hover {
      background: #cbd5e1;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .status {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1d4ed8;
    }
    .status.error {
      color: #dc2626;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
    }
    select, .range-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.9rem;
      cursor: pointer;
    }
    select:hover, .range-btn:hover {
      border-color: #94a3b8;
    }
    .range-btn.active {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label {
      font-size: 0.8rem;
      color: #64748b;
    }
    .stat-value {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 2px;
    }
    #chart {
      width: 100%;
      height: 560px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="title-wrap">
          <a href="index.html" class="back-link">→ כל הקידוחים</a>
          <h1 id="pageTitle">טוען...</h1>
        </div>
        <div id="status" class="status">טוען נתונים...</div>
      </div>

      <div class="toolbar">
        <div class="control-group">
          <label for="boreholeSelect">קידוח:</label>
          <select id="boreholeSelect">
            <option value="Meizar1">Meizar 1</option>
            <option value="Meizar2">Meizar 2</option>
            <option value="Meizar3">Meizar 3</option>
            <option value="EinHashofet">Ein Hashofet</option>
            <option value="Kinneret8">Kinneret 8</option>
            <option value="Kinneret10b">Kinneret 10b</option>
            <option value="Livnim1">Livnim 1</option>
            <option value="Haon1">Haon 1</option>
            <option value="Haon2">Haon 2</option>
            <option value="Gome1">Gome 1</option>
            <option value="Zofar20">Zofar 20</option>
          </select>

          <label for="seriesSelect">משתנה:</label>
          <select id="seriesSelect">
            <option value="level" selected>מפלס מים (m)</option>
            <option value="secondary">עומק למפלס / לחץ</option>
          </select>
        </div>

        <div class="control-group" id="rangeButtons">
          <label>טווח זמן:</label>
          <button type="button" class="range-btn active" data-range="all">הכל</button>
          <button type="button" class="range-btn" data-range="5y">5 שנים</button>
          <button type="button" class="range-btn" data-range="1y">שנה</button>
          <button type="button" class="range-btn" data-range="6m">6 חודשים</button>
          <button type="button" class="range-btn" data-range="1m">חודש</button>
        </div>

        <div class="control-group" id="yZoomButtons">
          <label>ציר אנכי:</label>
          <button type="button" class="range-btn active" data-drag="pan">גרירה</button>
          <button type="button" class="range-btn" data-drag="zoom">זום מלבני (X+Y)</button>
          <button type="button" class="range-btn" id="yZoomIn">זום Y +</button>
          <button type="button" class="range-btn" id="yZoomOut">זום Y -</button>
          <button type="button" class="range-btn" id="yReset">איפוס Y</button>
        </div>
      </div>

      <div class="summary">
        <div class="stat">
          <div class="stat-label">ערך אחרון</div>
          <div id="latestVal" class="stat-value">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">תאריך מדידה אחרונה</div>
          <div id="latestDate" class="stat-value">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">מספר תצפיות רציפות</div>
          <div id="countVal" class="stat-value">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">מדידות ידניות / טווח</div>
          <div id="extraStatVal" class="stat-value">—</div>
        </div>
      </div>

      <div id="chart"></div>
    </div>
  </div>

  <script>
    function setStatus(msg, isError = false) {
      const el = document.getElementById("status");
      if (!el) return;
      el.textContent = msg || "";
      el.className = isError ? "status error" : "status";
    }

    window.addEventListener("error", function (e) {
      setStatus("שגיאת סקריפט: " + (e.message || "שגיאה לא ידועה"), true);
    });

    window.addEventListener("unhandledrejection", function (e) {
      const reason = e && e.reason ? (e.reason.message || String(e.reason)) : "שגיאה אסינכרונית";
      setStatus("שגיאה אסינכרונית: " + reason, true);
    });

    const BOREHOLES = {
      Meizar1:     { name: "Meizar 1",     file: "data/Meizar1WA.csv" },
      Meizar2:     { name: "Meizar 2",     file: "data/Meizar2WA.csv" },
      Meizar3:     { name: "Meizar 3",     file: "data/Meizar3WA.csv" },
      EinHashofet: { name: "Ein Hashofet", file: "data/EinHashofetWA.csv" },
      Kinneret8:   { name: "Kinneret 8",   file: "data/Kinneret8WA.csv" },
      Kinneret10b: { name: "Kinneret 10b", file: "data/Kinneret10bWA.csv" },
      Livnim1:     { name: "Livnim 1",     file: "data/Livnim1WA.csv" },
      Haon1:       { name: "Haon 1",       file: "data/Haon1WA.csv" },
      Haon2:       { name: "Haon 2",       file: "data/Haon2WA.csv" },
      Gome1:       { name: "Gome 1",       file: "data/gome1WA.csv" },
      Zofar20:     { name: "Zofar 20",     file: "data/Zofar20WA.csv" }
    };

    let parsedRows = [];
    let parsedFields = [];
    let activeRange = "all";
    let activeDragMode = "pan";
    let loadSeq = 0;

    const TS_ANY_RE = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/;
    const EXCEL_EPOCH_UTC_MS = Date.UTC(1899, 11, 30);
    const MS_PER_DAY = 86400 * 1000;

    function parseExcelSerialDate(val) {
      if (val === undefined || val === null) return null;
      const str = String(val).trim();
      if (!str || !/^[+-]?\d+(\.\d+)?$/.test(str)) return null;
      const serial = Number(str);
      if (!Number.isFinite(serial) || serial < 20000 || serial > 80000) return null;
      const totalMinutes = Math.round(serial * 1440);
      const d = new Date(EXCEL_EPOCH_UTC_MS + totalMinutes * 60000);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function buildValidDate(year, month, day, hh, mm) {
      if (month < 1 || month > 12 || day < 1 || day > 31) return null;
      const d = new Date(year, month - 1, day, hh, mm, 0, 0);
      if (
        d.getFullYear() !== year ||
        d.getMonth() !== month - 1 ||
        d.getDate() !== day ||
        d.getHours() !== hh ||
        d.getMinutes() !== mm
      ) {
        return null;
      }
      return d;
    }

    function formatIsoLocal(d) {
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
    }

    function formatDisplayDate(d) {
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function parseMixedTimestamps(strings) {
      const n = strings.length;
      const candidates = new Array(n).fill(null);
      const settled = new Array(n).fill(null);
      const directDates = new Array(n).fill(null);

      for (let i = 0; i < n; i++) {
        const s = strings[i];
        if (typeof s !== "string") continue;
        const excelDt = parseExcelSerialDate(s);
        if (excelDt) {
          directDates[i] = excelDt;
          continue;
        }
        const m = TS_ANY_RE.exec(s);
        if (!m) continue;
        const a = parseInt(m[1], 10);
        const b = parseInt(m[2], 10);
        const y = parseInt(m[3], 10);
        const hh = parseInt(m[4], 10);
        const mm = parseInt(m[5], 10);

        const c = {};
        const dmy = buildValidDate(y, b, a, hh, mm);
        const mdy = buildValidDate(y, a, b, hh, mm);
        if (dmy) c.dmy = dmy;
        if (mdy) c.mdy = mdy;

        const keys = Object.keys(c);
        if (keys.length === 0) continue;
        candidates[i] = c;
        if (keys.length === 1) {
          settled[i] = keys[0];
        }
      }

      const prevFmt = new Array(n).fill(null);
      let lastIdx = -1e9;
      let lastFmt = null;
      for (let i = 0; i < n; i++) {
        if (settled[i]) {
          lastFmt = settled[i];
          lastIdx = i;
        }
        prevFmt[i] = { fmt: lastFmt, idx: lastIdx };
      }

      const nextFmt = new Array(n).fill(null);
      lastIdx = 1e9;
      lastFmt = null;
      for (let i = n - 1; i >= 0; i--) {
        if (settled[i]) {
          lastFmt = settled[i];
          lastIdx = i;
        }
        nextFmt[i] = { fmt: lastFmt, idx: lastIdx };
      }

      const out = new Array(n).fill(null);
      let prevDate = null;

      for (let i = 0; i < n; i++) {
        if (directDates[i]) {
          out[i] = directDates[i];
          prevDate = directDates[i];
          continue;
        }
        const c = candidates[i];
        if (!c) continue;

        let chosen = null;
        if (c.dmy && !c.mdy) {
          chosen = c.dmy;
        } else if (c.mdy && !c.dmy) {
          chosen = c.mdy;
        } else if (c.dmy.getTime() === c.mdy.getTime()) {
          chosen = c.dmy;
        } else {
          const pf = prevFmt[i];
          const nf = nextFmt[i];
          let fmt = "dmy";
          if (pf.fmt && nf.fmt) {
            fmt = (i - pf.idx) <= (nf.idx - i) ? pf.fmt : nf.fmt;
          } else if (pf.fmt) {
            fmt = pf.fmt;
          } else if (nf.fmt) {
            fmt = nf.fmt;
          }
          const altFmt = fmt === "dmy" ? "mdy" : "dmy";
          chosen = c[fmt];
          const alt = c[altFmt];
          if (
            prevDate !== null &&
            alt &&
            Math.abs(chosen.getTime() - prevDate.getTime()) > MS_PER_DAY &&
            Math.abs(alt.getTime() - prevDate.getTime()) <= MS_PER_DAY
          ) {
            chosen = alt;
          }
        }
        out[i] = chosen;
        prevDate = chosen;
      }

      return out;
    }

    function getXAxisRange(maxIsoStr) {
      if (activeRange === "all" || !maxIsoStr) return null;
      const endDate = new Date(maxIsoStr);
      if (Number.isNaN(endDate.getTime())) return null;
      const startDate = new Date(endDate);

      if (activeRange === "5y") startDate.setFullYear(startDate.getFullYear() - 5);
      else if (activeRange === "1y") startDate.setFullYear(startDate.getFullYear() - 1);
      else if (activeRange === "6m") startDate.setMonth(startDate.getMonth() - 6);
      else if (activeRange === "1m") startDate.setMonth(startDate.getMonth() - 1);

      return [startDate.toISOString(), endDate.toISOString()];
    }

    function resolveColumns(mode) {
      const hasLevel = parsedFields.includes("above sea level (m)") || parsedFields.includes("water level (m)");
      const hasSecondary =
        parsedFields.includes("depth to water level (m)") ||
        parsedFields.includes("pressure (bar)") ||
        parsedFields.includes("water pressure");

      if (mode === "level") {
        if (parsedFields.includes("above sea level (m)")) {
          let manCol = null;
          if (parsedFields.includes("above sea level (m).1")) manCol = "above sea level (m).1";
          else if (parsedFields.includes("Unnamed: 4")) manCol = "Unnamed: 4";
          else if (parsedFields.includes("Unnamed: 6")) manCol = "Unnamed: 6";
          return {
            col: "above sea level (m)",
            manCol,
            unit: "m",
            title: "מפלס מעל פני הים (m)"
          };
        }
        if (parsedFields.includes("water level (m)")) {
          return {
            col: "water level (m)",
            manCol: null,
            unit: "m",
            title: "מפלס מים (m)"
          };
        }
        if (!hasLevel && parsedFields.includes("water pressure (bar)")) {
          return {
            col: "water pressure (bar)",
            manCol: null,
            unit: "bar",
            title: "לחץ מים (bar)"
          };
        }
        if (!hasLevel && parsedFields.includes("water pressure")) {
          return {
            col: "water pressure",
            manCol: null,
            unit: "",
            title: "water pressure"
          };
        }
      } else {
        if (parsedFields.includes("depth to water level (m)")) {
          return {
            col: "depth to water level (m)",
            manCol: parsedFields.includes("Unnamed: 3") ? "Unnamed: 3" : null,
            unit: "m",
            title: "עומק למפלס (m)"
          };
        }
        if (parsedFields.includes("pressure (bar)")) {
          return {
            col: "pressure (bar)",
            manCol: null,
            unit: "bar",
            title: "לחץ (bar)"
          };
        }
        if (!hasSecondary && parsedFields.includes("water pressure (bar)")) {
          return {
            col: "water pressure (bar)",
            manCol: null,
            unit: "bar",
            title: "לחץ מים (bar)"
          };
        }
        if (parsedFields.includes("water pressure")) {
          return {
            col: "water pressure",
            manCol: null,
            unit: "",
            title: "water pressure"
          };
        }
      }
      return { col: null, manCol: null, unit: "", title: "ערך" };
    }

    function getTimestampField() {
      if (parsedFields.includes("TIMESTAMP")) return "TIMESTAMP";
      if (parsedFields.includes("time")) return "time";
      return parsedFields[0] || null;
    }

    function toNum(v) {
      if (v === undefined || v === null) return NaN;
      const s = String(v).trim();
      if (!s || s.toUpperCase() === "NAN" || s.toUpperCase() === "NULL") return NaN;
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    function renderChart() {
      const bhKey = document.getElementById("boreholeSelect").value;
      const bhInfo = BOREHOLES[bhKey] || { name: bhKey, file: "" };
      const mode = document.getElementById("seriesSelect").value;
      const tsField = getTimestampField();
      const spec = resolveColumns(mode);

      document.getElementById("pageTitle").textContent = `${bhInfo.name} — ${spec.title}`;
      document.title = `${bhInfo.name} | תצוגת קידוח`;

      if (!tsField || !spec.col || !parsedRows.length) {
        setStatus("לא נמצאו עמודות תקינות להצגה בקובץ", true);
        Plotly.purge("chart");
        return;
      }

      const rawTsStrings = parsedRows.map((r) => r[tsField]);
      const dates = parseMixedTimestamps(rawTsStrings);

      const pts = [];
      const manPts = [];

      for (let i = 0; i < parsedRows.length; i++) {
        const d = dates[i];
        if (!d || Number.isNaN(d.getTime())) continue;
        const row = parsedRows[i];
        const val = toNum(row[spec.col]);
        if (Number.isFinite(val)) {
          pts.push({ d, iso: formatIsoLocal(d), val });
        }
        if (spec.manCol) {
          const mVal = toNum(row[spec.manCol]);
          if (Number.isFinite(mVal)) {
            manPts.push({ d, iso: formatIsoLocal(d), val: mVal });
          }
        }
      }

      pts.sort((a, b) => a.d.getTime() - b.d.getTime());
      manPts.sort((a, b) => a.d.getTime() - b.d.getTime());

      if (!pts.length) {
        setStatus("אין ערכים מספריים תקינים בעמודה הנבחרת", true);
        Plotly.purge("chart");
        return;
      }

      // Break trace across gaps > 6 hours
      const xLine = [];
      const yLine = [];
      for (let i = 0; i < pts.length; i++) {
        if (i > 0) {
          const gapHours = (pts[i].d.getTime() - pts[i - 1].d.getTime()) / 3600000;
          if (gapHours > 6) {
            xLine.push(pts[i - 1].iso);
            yLine.push(null);
          }
        }
        xLine.push(pts[i].iso);
        yLine.push(pts[i].val);
      }

      const traces = [
        {
          type: "scatter",
          mode: "lines",
          name: "מדידה אוטומטית",
          x: xLine,
          y: yLine,
          line: { color: "#1d4ed8", width: 1.5 },
          connectgaps: false
        }
      ];

      if (manPts.length > 0) {
        traces.push({
          type: "scatter",
          mode: "markers",
          name: "מדידה ידנית",
          x: manPts.map((m) => m.iso),
          y: manPts.map((m) => m.val),
          marker: { color: "#dc2626", size: 7, line: { color: "#7f1d1d", width: 1 } }
        });
      }

      const lastPt = pts[pts.length - 1];
      const firstPt = pts[0];
      const xRange = getXAxisRange(lastPt.iso);

      const layout = {
        dragmode: activeDragMode,
        hovermode: "x unified",
        paper_bgcolor: "#ffffff",
        plot_bgcolor: "#ffffff",
        margin: { t: 24, r: 24, b: 50, l: 64 },
        xaxis: {
          title: "תאריך",
          gridcolor: "#e2e8f0",
          range: xRange || undefined
        },
        yaxis: {
          title: spec.title,
          gridcolor: "#e2e8f0",
          autorange: true,
          fixedrange: false
        },
        legend: { orientation: "h", y: 1.08, x: 0 }
      };

      Plotly.newPlot("chart", traces, layout, {
        responsive: true,
        displaylogo: false
      });

      const unitSuffix = spec.unit ? ` ${spec.unit}` : "";
      document.getElementById("latestVal").textContent = `${lastPt.val.toFixed(3)}${unitSuffix}`;
      document.getElementById("latestDate").textContent = formatDisplayDate(lastPt.d);
      document.getElementById("countVal").textContent = pts.length.toLocaleString("he-IL");
      document.getElementById("extraStatVal").textContent =
        `${manPts.length} ידניות | ${firstPt.d.getFullYear()}–${lastPt.d.getFullYear()}`;

      setStatus("");
    }

    async function loadBorehole(bhKey) {
      const seq = ++loadSeq;
      const info = BOREHOLES[bhKey] || BOREHOLES.Meizar1;
      document.getElementById("boreholeSelect").value = info.file ? bhKey : "Meizar1";
      document.getElementById("pageTitle").textContent = info.name;
      setStatus("טוען נתונים...");

      try {
        const res = await fetch(info.file, { cache: "no-store" });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status} עבור ${info.file}`);
        }
        const text = await res.text();
        if (seq !== loadSeq) return;

        const parsed = Papa.parse(text, {
          header: true,
          skipEmptyLines: true
        });

        parsedFields = parsed.meta && Array.isArray(parsed.meta.fields) ? parsed.meta.fields : [];
        parsedRows = Array.isArray(parsed.data) ? parsed.data : [];

        renderChart();
      } catch (err) {
        if (seq !== loadSeq) return;
        setStatus("שגיאה בטעינת הנתונים: " + (err && err.message ? err.message : String(err)), true);
        Plotly.purge("chart");
      }
    }

    function zoomYAxis(factor) {
      const gd = document.getElementById("chart");
      if (!gd || !gd._fullLayout || !gd._fullLayout.yaxis) return;
      const r = gd._fullLayout.yaxis.range;
      if (!Array.isArray(r) || r.length < 2) return;
      const minV = Number(r[0]);
      const maxV = Number(r[1]);
      if (!Number.isFinite(minV) || !Number.isFinite(maxV)) return;
      const mid = (minV + maxV) / 2;
      const half = ((maxV - minV) / 2) * factor;
      Plotly.relayout("chart", { "yaxis.range": [mid - half, mid + half] });
    }

    document.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);
      const initialId = params.get("id");
      const bhKey = initialId && BOREHOLES[initialId] ? initialId : "Meizar1";

      document.getElementById("boreholeSelect").addEventListener("change", function () {
        const nextKey = this.value;
        const url = new URL(window.location.href);
        url.searchParams.set("id", nextKey);
        window.history.replaceState({}, "", url.toString());
        loadBorehole(nextKey);
      });

      document.getElementById("seriesSelect").addEventListener("change", function () {
        renderChart();
      });

      document.querySelectorAll("#rangeButtons .range-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          document.querySelectorAll("#rangeButtons .range-btn").forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          activeRange = this.dataset.range || "all";
          renderChart();
        });
      });

      document.querySelectorAll("#yZoomButtons .range-btn[data-drag]").forEach((btn) => {
        btn.addEventListener("click", function () {
          document.querySelectorAll("#yZoomButtons .range-btn[data-drag]").forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          activeDragMode = this.dataset.drag || "pan";
          Plotly.relayout("chart", { dragmode: activeDragMode });
        });
      });

      document.getElementById("yZoomIn").addEventListener("click", () => zoomYAxis(0.7));
      document.getElementById("yZoomOut").addEventListener("click", () => zoomYAxis(1.4));
      document.getElementById("yReset").addEventListener("click", () => {
        Plotly.relayout("chart", { "yaxis.autorange": true });
      });

      loadBorehole(bhKey);
    });
  </script>
</body>
</html>
