<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תצוגת קידוח</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f1f5f9;
      color: #0f172a;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back-link {
      text-decoration: none;
      background: #e2e8f0;
      color: #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .back-link:hover {
      background: #cbd5e1;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .status {
      font-size: 0.95rem;
      font-weight: 600;
      color: #1d4ed8;
    }
    .status.error {
      color: #dc2626;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
    }
    select, .range-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      font-size: 0.9rem;
      cursor: pointer;
    }
    select:hover, .range-btn:hover {
      border-color: #94a3b8;
    }
    .range-btn.active {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #1d4ed8;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label {
      font-size: 0.8rem;
      color: #64748b;
    }
    .stat-value {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 2px;
    }
    #chart {
      width: 100%;
      height: 560px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="title-wrap">
          <a href="index.html" class="back-link">→ כל הקידוחים</a>
          <h1 id="pageTitle">טוען...</h1>
        </div>
        <div id="status" class="status">מאתחל...</div>
      </div>

      <div class="toolbar">
        <div class="control-group">
          <label for="boreholeSelect">קידוח:</label>
          <select id="boreholeSelect">
            <option value="Meizar1">Meizar 1</option>
            <option value="Meizar2">Meizar 2</option>
            <option value="Meizar3">Meizar 3</option>
            <option value="EinHashofet">Ein Hashofet</option>
            <option value="Kinneret8">Kinneret 8</option>
            <option value="Kinneret10b">Kinneret 10b</option>
            <option value="Livnim1">Livnim 1</option>
            <option value="Haon1">Haon 1</option>
            <option value="Haon2">Haon 2</option>
            <option value="Gome1">Gome 1</option>
            <option value="Zofar20">Zofar 20</option>
          </select>

          <label for="seriesSelect">משתנה:</label>
          <select id="seriesSelect">
            <option value="level" selected>מפלס מים (m)</option>
            <option value="secondary">עומק למפלס / לחץ</option>
          </select>
        </div>

        <div class="control-group" id="rangeButtons">
          <label>טווח זמן:</label>
          <button type="button" class="range-btn active" data-range="all">הכל</button>
          <button type="button" class="range-btn" data-range="5y">5 שנים</button>
          <button type="button" class="range-btn" data-range="1y">שנה</button>
          <button type="button" class="range-btn" data-range="6m">6 חודשים</button>
          <button type="button" class="range-btn" data-range="1m">חודש</button>
        </div>

        <div class="control-group" id="yZoomButtons">
          <label>ציר אנכי:</label>
          <button type="button" class="range-btn active" data-drag="pan">גרירה</button>
          <button type="button" class="range-btn" data-drag="zoom">זום מלבני (X+Y)</button>
          <button type="button" class="range-btn" id="yZoomIn">זום Y +</button>
          <button type="button" class="range-btn" id="yZoomOut">זום Y -</button>
          <button type="button" class="range-btn" id="yReset">איפוס Y</button>
        </div>
      </div>

      <div class="summary">
        <div class="stat">
          <div class="stat-label">ערך אחרון</div>
          <div id="latestVal" class="stat-value">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">תאריך מדידה אחרונה</div>
          <div id="latestDate" class="stat-value">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">מספר תצפיות רציפות</div>
          <div id="countVal" class="stat-value">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">מדידות ידניות / טווח</div>
          <div id="extraStatVal" class="stat-value">—</div>
        </div>
      </div>

      <div id="chart"></div>
    </div>
  </div>

  <script>
    const BOREHOLES = {
      Meizar1:     { name: "Meizar 1",     file: "data/Meizar1WA.csv" },
      Meizar2:     { name: "Meizar 2",     file: "data/Meizar2WA.csv" },
      Meizar3:     { name: "Meizar 3",     file: "data/Meizar3WA.csv" },
      EinHashofet: { name: "Ein Hashofet", file: "data/EinHashofetWA.csv" },
      Kinneret8:   { name: "Kinneret 8",   file: "data/Kinneret8WA.csv" },
      Kinneret10b: { name: "Kinneret 10b", file: "data/Kinneret10bWA.csv" },
      Livnim1:     { name: "Livnim 1",     file: "data/Livnim1WA.csv" },
      Haon1:       { name: "Haon 1",       file: "data/Haon1WA.csv" },
      Haon2:       { name: "Haon 2",       file: "data/Haon2WA.csv" },
      Gome1:       { name: "Gome 1",       file: "data/gome1WA.csv" },
      Zofar20:     { name: "Zofar 20",     file: "data/Zofar20WA.csv" }
    };

    let parsedRows = [];
    let parsedFields = [];
    let activeRange = "all";
    let activeDragMode = "pan";
    let loadSeq = 0;

    const TS_ANY_RE = /^\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})/;
    const EXCEL_EPOCH_UTC_MS = Date.UTC(1899, 11, 30);
    const MS_PER_DAY = 86400 * 1000;

    function setStatus(msg, isError = false) {
      const el = document.getElementById("status");
      el.textContent = msg;
      el.className = isError ? "status error" : "status";
    }

    function parseExcelSerialDate(val) {
      if (val === undefined || val === null) return null;
      const str = String(val).trim();
      if (!str || !/^[+-]?\d+(\.\d+)?$/.test(str)) return null;
      const serial = Number(str);
      if (!Number.isFinite(serial) || serial < 20000 || serial > 80000) return null;
      const totalMinutes = Math.round(serial * 1440);
      const d = new Date(EXCEL_EPOCH_UTC_MS + totalMinutes * 60000);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function buildValidDate(year, month, day, hh, mm) {
      if (month < 1 || month > 12 || day < 1 || day > 31) return null;
      const d = new Date(year, month - 1, day, hh, mm, 0, 0);
      if (
        d.getFullYear() !== year ||
        d.getMonth() !== month - 1 ||
        d.getDate() !== day ||
        d.getHours() !== hh ||
        d.getMinutes() !== mm
      ) {
        return null;
      }
      return d;
    }

    function formatIsoLocal(d) {
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
    }

    function parseMixedTimestamps(strings) {
      const n = strings.length;
      const candidates = new Array(n).fill(null);
      const settled = new Array(n).fill(null);
      const directDates = new Array(n).fill(null);

      for (let i = 0; i < n; i++) {
        const s = strings[i];
        if (typeof s !== "string") continue;
        const excelDt = parseExcelSerialDate(s);
        if (excelDt) {
          directDates[i] = excelDt;
          continue;
        }
        const m = TS_ANY_RE.exec(s);
        if (!m) continue;
        const a = parseInt(m[1], 10);
        const b = parseInt(m[2], 10);
        const y = parseInt(m[3], 10);
        const hh = parseInt(m[4], 10);
        const mm = parseInt(m[5], 10);

        const c = {};
        const dmy = buildValidDate(y, b, a, hh, mm);
        const mdy = buildValidDate(y, a, b, hh, mm);
        if (dmy) c.dmy = dmy;
        if (mdy) c.mdy = mdy;

        const keys = Object.keys(c);
        if (keys.length === 0) continue;
        candidates[i] = c;
        if (keys.length === 1) {
          settled[i] = keys[0];
        }
      }

      const prevFmt = new Array(n).fill(null);
      let lastIdx = -1e9;
      let lastFmt = null;
      for (let i = 0; i < n; i++) {
        if (settled[i]) {
          lastFmt = settled[i];
          lastIdx = i;
        }
        prevFmt[i] = { fmt: lastFmt, idx: lastIdx };
      }

      const nextFmt = new Array(n).fill(null);
      lastIdx = 1e9;
      lastFmt = null;
      for (let i = n - 1; i >= 0; i--) {
        if (settled[i]) {
          lastFmt = settled[i];
          lastIdx = i;
        }
        nextFmt[i] = { fmt: lastFmt, idx: lastIdx };
      }

      const out = new Array(n).fill(null);
      let prevDate = null;

      for (let i = 0; i < n; i++) {
        if (directDates[i]) {
          out[i] = directDates[i];
          prevDate = directDates[i];
          continue;
        }
        const c = candidates[i];
        if (!c) continue;

        let chosen = null;
        if (c.dmy && !c.mdy) {
          chosen = c.dmy;
        } else if (c.mdy && !c.dmy) {
          chosen = c.mdy;
        } else if (c.dmy.getTime() === c.mdy.getTime()) {
          chosen = c.dmy;
        } else {
          const pf = prevFmt[i];
          const nf = nextFmt[i];
          let fmt = "dmy";
          if (pf.fmt && nf.fmt) {
            fmt = (i - pf.idx) <= (nf.idx - i) ? pf.fmt : nf.fmt;
          } else if (pf.fmt) {
            fmt = pf.fmt;
          } else if (nf.fmt) {
            fmt = nf.fmt;
          }
          const altFmt = fmt === "dmy" ? "mdy" : "dmy";
          chosen = c[fmt];
          const alt = c[altFmt];
          if (
            prevDate !== null &&
            alt &&
            Math.abs(chosen.getTime() - prevDate.getTime()) > MS_PER_DAY &&
            Math.abs(alt.getTime() - prevDate.getTime()) <= MS_PER_DAY
          ) {
            chosen = alt;
          }
        }
        out[i] = chosen;
        prevDate = chosen;
      }

      return out;
    }

    function getXAxisRange(maxIsoStr) {
      if (activeRange === "all" || !maxIsoStr) return null;
      const endDate = new Date(maxIsoStr);
      if (Number.isNaN(endDate.getTime())) return null;
      const startDate = new Date(endDate);

      if (activeRange === "5y") startDate.setFullYear(startDate.getFullYear() - 5);
      else if (activeRange === "1y") startDate.setFullYear(startDate.getFullYear() - 1);
      else if (activeRange === "6m") startDate.setMonth(startDate.getMonth() - 6);
      else if (activeRange === "1m") startDate.setMonth(startDate.getMonth() - 1);

      return [startDate.toISOString(), endDate.toISOString()];
    }

    function resolveColumns(mode) {
      const hasLevel = parsedFields.includes("above sea level (m)") || parsedFields.includes("water level (m)");
      const hasSecondary =
        parsedFields.includes("depth to water level (m)") ||
        parsedFields.includes("pressure (bar)") ||
        parsedFields.includes("water pressure");

      if (mode === "level") {
        if (parsedFields.includes("above sea level (m)")) {
          let manCol = null;
          if (parsedFields.includes("above sea level (m).1")) manCol = "above sea level (m).1";
          else if (parsedFields.includes("Unnamed: 4")) manCol = "Unnamed: 4";
          else if (parsedFields.includes("Unnamed: 6")) manCol = "Unnamed: 6";
          return {
            col: "above sea level (m)",
            manCol,
            unit: "m",
            title: "מפלס מעל פני הים (m)"
          };
        }
        if (parsedFields.includes("water level (m)")) {
          return {
            col: "water level (m)",
            manCol: null,
            unit: "m",
            title: "מפלס מים (m)"
          };
        }
        if (!hasLevel && parsedFields.includes("water pressure (bar)")) {
          return {
            col: "water pressure (bar)",
            manCol: null,
            unit: "bar",
            title: "לחץ מים (bar)"
          };
        }
        if (!hasLevel && parsedFields.includes("water pressure")) {
          return {
            col: "water pressure",
            manCol: null,
            unit: "",
            title: "water pressure"
          };
        }
      } else {
        if (parsedFields.includes("depth to water level (m)")) {
          return {
            col: "depth to water level (m)",
            manCol: parsedFields.includes("Unnamed: 3") ? "Unnamed: 3" : null,
            unit: "m",
            title: "עומק למפלס (m)"
          };
        }
        if (parsedFields.includes("pressure (bar)")) {
          return {
            col: "pressure (bar)",
            manCol: null,
            unit: "bar",
            title: "לחץ (bar)"
          };
        }
        if (!hasSecondary && parsedFields.includes("water pressure (bar)")) {
          return {
            col: "water pressure (bar)",
            manCol: null,
            unit: "bar",
            title: "לחץ מים (bar)"
          };
        }
        if (parsedFields.includes("water pressure")) {
          return {
            col: "water pressure",
            manCol: null,
            unit: "",
            title: "water pressure"
          };
        }
      }
      return { col: null, manCol: null, unit: "", title: "ערך" };
    }

    function getTimestampField() {
      if (parsedFields.includes("TIMESTAMP")) return "TIMESTAMP";
      if (parsedFields.includes("time")) return "time";
      return parsedFields[0] || "TIMESTAMP";
    }

    function renderChart() {
      const mode = document.getElementById("seriesSelect").value;
      const sel = document.getElementById("boreholeSelect");
      const boreholeName = sel.selectedOptions[0].text;
      document.title = `סדרת זמן — ${boreholeName}`;
      document.getElementById("pageTitle").textContent = `סדרת זמן — ${boreholeName}`;

      const { col, manCol, unit, title } = resolveColumns(mode);
      if (!col) {
        setStatus(`העמודה המבוקשת לא קיימת בקובץ (עמודות שנמצאו: ${parsedFields.join(", ")})`, true);
        Plotly.purge("chart");
        return;
      }

      const tsField = getTimestampField();
      const rawTimestamps = parsedRows.map(r => r[tsField]);
      const parsedDates = parseMixedTimestamps(rawTimestamps);

      const records = [];
      for (let i = 0; i < parsedRows.length; i++) {
        const dt = parsedDates[i];
        if (!dt) continue;
        const rawVal = parsedRows[i][col];
        if (rawVal === undefined || rawVal === null || String(rawVal).trim() === "") continue;
        const val = Number(rawVal);
        if (Number.isNaN(val) || Math.abs(val) >= 1e5) continue;
        records.push({ dt, val });
      }

      records.sort((a, b) => a.dt.getTime() - b.dt.getTime());

      if (records.length === 0) {
        setStatus("לא נמצאו נתונים תקינים להצגה בקובץ זה.", true);
        Plotly.purge("chart");
        return;
      }

      const x = [];
      const y = [];
      const sixHoursMs = 6 * 3600 * 1000;
      for (let i = 0; i < records.length; i++) {
        if (i > 0 && (records[i].dt.getTime() - records[i - 1].dt.getTime()) > sixHoursMs) {
          x.push(formatIsoLocal(records[i].dt));
          y.push(null);
        }
        x.push(formatIsoLocal(records[i].dt));
        y.push(records[i].val);
      }

      const manX = [];
      const manY = [];
      if (manCol) {
        for (let i = 0; i < parsedRows.length; i++) {
          const dt = parsedDates[i];
          if (!dt) continue;
          const rawMan = parsedRows[i][manCol];
          if (rawMan === undefined || rawMan === null || String(rawMan).trim() === "") continue;
          const mv = Number(rawMan);
          if (!Number.isNaN(mv) && Math.abs(mv) < 1e5) {
            manX.push(formatIsoLocal(dt));
            manY.push(mv);
          }
        }
      }

      const firstDt = records[0].dt;
      const lastRec = records[records.length - 1];
      const valSuffix = unit ? ` ${unit}` : "";
      document.getElementById("latestVal").textContent = `${lastRec.val.toFixed(3)}${valSuffix}`;
      document.getElementById("latestDate").textContent = formatIsoLocal(lastRec.dt).replace("T", " ");
      document.getElementById("countVal").textContent = records.length.toLocaleString();
      document.getElementById("extraStatVal").textContent = manCol
        ? `${manX.length} ידניות (${firstDt.getFullYear()}–${lastRec.dt.getFullYear()})`
        : `${firstDt.getFullYear()}–${lastRec.dt.getFullYear()}`;
      setStatus("הנתונים נטענו בהצלחה");

      const traces = [
        {
          x: x,
          y: y,
          type: "scattergl",
          mode: "lines",
          connectgaps: false,
          name: title,
          line: { width: 1.5, color: "#1d4ed8" }
        }
      ];

      if (manCol && manX.length > 0) {
        traces.push({
          x: manX,
          y: manY,
          type: "scatter",
          mode: "markers",
          name: "מדידות ידניות",
          marker: { size: 7, color: "#dc2626", symbol: "circle" }
        });
      }

      const xaxisConfig = {
        title: "תאריך ושעה",
        rangeslider: { visible: true, thickness: 0.06 }
      };

      const computedRange = getXAxisRange(formatIsoLocal(lastRec.dt));
      if (computedRange) {
        xaxisConfig.range = computedRange;
      }

      const layout = {
        xaxis: xaxisConfig,
        yaxis: {
          title: title,
          fixedrange: false
        },
        dragmode: activeDragMode,
        hovermode: "x unified",
        legend: { orientation: "h", y: 1.12 },
        margin: { t: 30, r: 20, b: 60, l: 75 }
      };

      Plotly.newPlot("chart", traces, layout, { responsive: true });
    }

    async function loadBorehole(id) {
      const seq = ++loadSeq;
      const validId = id in BOREHOLES ? id : "Meizar1";
      const cfg = BOREHOLES[validId];

      document.getElementById("boreholeSelect").value = validId;
      document.title = `סדרת זמן — ${cfg.name}`;
      document.getElementById("pageTitle").textContent = `סדרת זמן — ${cfg.name}`;
      setStatus(`מוריד נתונים מתוך ${cfg.file}...`);

      const url = new URL(window.location.href);
      url.searchParams.set("id", validId);
      window.history.replaceState({}, "", url);

      try {
        const resp = await fetch(cfg.file, { cache: "no-store" });
        if (seq !== loadSeq) return;
        if (!resp.ok) {
          setStatus(`שגיאת HTTP ${resp.status} בטעינת ${cfg.file}`, true);
          Plotly.purge("chart");
          return;
        }

        const csvText = await resp.text();
        if (seq !== loadSeq) return;

        setStatus("מפענח שורות ומחשב תאריכים...");
        setTimeout(() => {
          if (seq !== loadSeq) return;
          const results = Papa.parse(csvText, {
            header: true,
            skipEmptyLines: true
          });

          const rawFields = (results.meta && results.meta.fields) ? results.meta.fields : [];
          parsedFields = rawFields.map(f => (f || "").trim());
          parsedRows = (results.data || []).map(row => {
            const cleanRow = {};
            rawFields.forEach((origKey, idx) => {
              const trimKey = parsedFields[idx];
              cleanRow[trimKey] = row[origKey];
            });
            return cleanRow;
          });

          renderChart();
        }, 20);
      } catch (err) {
        if (seq !== loadSeq) return;
        setStatus(`שגיאה בהורדת ${cfg.file}: ${err && err.message ? err.message : err}`, true);
        Plotly.purge("chart");
      }
    }

    function zoomYAxis(factor) {
      const chartDiv = document.getElementById("chart");
      const yRange = chartDiv.layout && chartDiv.layout.yaxis && chartDiv.layout.yaxis.range;
      if (!yRange || yRange.length < 2) return;

      const y0 = yRange[0];
      const y1 = yRange[1];
      const center = (y0 + y1) / 2;
      const halfSpan = ((y1 - y0) / 2) *
